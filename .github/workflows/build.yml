          cat > app/src/main/java/com/namikaze/app/Prefs.kt <<'EOF'
          package com.namikaze.app
          import android.content.Context
          import android.content.SharedPreferences
          object Prefs {
              fun vault(ctx: Context): SharedPreferences =
                  ctx.getSharedPreferences("namikaze_core", Context.MODE_PRIVATE)
          }
          EOF
          cat > app/src/main/java/com/namikaze/app/LicenseManager.kt <<'EOF'
          package com.namikaze.app
          import android.content.Context
          import javax.crypto.Mac
          import javax.crypto.spec.SecretKeySpec
          object LicenseManager {
              private val REGISTRY = mapOf("2000" to 30L, "2001" to 90L, "200100" to 0L)
              private const val SECRET = "NAMIKAZE-2026-K3Y-ANONYMALKAZE"
              private fun sign(k: String): String {
                  val m = Mac.getInstance("HmacSHA256")
                  m.init(SecretKeySpec(SECRET.toByteArray(), "HmacSHA256"))
                  return m.doFinal(k.toByteArray()).joinToString("") { "%02x".format(it) }
              }
              fun activate(ctx: Context, raw: String): Boolean {
                  val key = raw.replace(" ", "").replace("-", "")
                  val days = REGISTRY[key] ?: return false
                  val exp = if (days == 0L) Long.MAX_VALUE else System.currentTimeMillis() + days * 86_400_000L
                  Prefs.vault(ctx).edit().putString("lic_key", key)
                      .putString("lic_sig", sign(key)).putLong("lic_exp", exp).apply()
                  return true
              }
              fun isActive(ctx: Context): Boolean {
                  val p = Prefs.vault(ctx)
                  val k = p.getString("lic_key", null) ?: return false
                  if (p.getString("lic_sig", null) != sign(k)) return false
                  return System.currentTimeMillis() < p.getLong("lic_exp", 0)
              }
          }
          EOF
          cat > app/src/main/java/com/namikaze/app/Notifier.kt <<'EOF'
          package com.namikaze.app
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import androidx.core.app.NotificationCompat
          object Notifier {
              private const val CH = "namikaze"
              fun setup(ctx: Context) {
                  ctx.getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel(CH, "NAMIKAZE", NotificationManager.IMPORTANCE_HIGH))
              }
              fun show(ctx: Context, title: String, body: String) {
                  val n = NotificationCompat.Builder(ctx, CH)
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setContentTitle(title).setContentText(body).build()
                  runCatching { ctx.getSystemService(NotificationManager::class.java).notify(body.hashCode(), n) }
              }
          }
